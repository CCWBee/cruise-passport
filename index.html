<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#FBF3E2" />
    <title>Sun Princess Cocktail Passport</title>
    <meta name="description" content="Tick off, rate and log all 214 cocktails aboard the Sun Princess (3 to 17 October 2026). Earn badges, unlock a Cruise Wrapped finale, and see what your crew loved. Works offline." />

    <!-- icons -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- installable web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cocktails" />

    <!-- share preview (Open Graph + Twitter). Absolute URLs for crawlers; canonical host is the Pages domain. -->
    <link rel="canonical" href="https://cruise.charlesbee.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cocktail Passport" />
    <meta property="og:title" content="Sun Princess Cocktail Passport" />
    <meta property="og:description" content="Tick off all 214 cocktails aboard the Sun Princess. Badges, a Cruise Wrapped finale, and what your crew loved." />
    <meta property="og:url" content="https://cruise.charlesbee.org/" />
    <meta property="og:image" content="https://cruise.charlesbee.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sun Princess Cocktail Passport" />
    <meta name="twitter:description" content="Tick off all 214 cocktails aboard. Badges, a Cruise Wrapped finale, and what your crew loved." />
    <meta name="twitter:image" content="https://cruise.charlesbee.org/og.png" />
    <script>
    /* Demo seed. Two rules: it needs an exact `?seed` parameter, not the substring, and a production
       build only ever seeds a passport nobody has touched. Touched means any drink, any venue, any
       friend, any group, any custom drink or a profile name, so a shared link cannot wipe a real
       user, including one who has joined and named themselves but not yet logged a drink. The dev
       server still overwrites unconditionally, which is what tools/qa relies on. */
    (function () {
      try {
        var q = new URLSearchParams(location.search)
        if (!q.has('seed')) return
        var DEV = '%MODE%' !== 'production'
        if (!DEV) {
          try {
            var st = JSON.parse(localStorage.getItem('spcc2') || 'null')
            st = st && st.state
            var n = function (o) { return o ? Object.keys(o).length : 0 }
            if (st && (n(st.me && st.me.entries) || n(st.me && st.me.visits) ||
                (st.friends || []).length || (st.groups || []).length ||
                (st.custom || []).length || (st.profile && st.profile.name))) return
          } catch (e) {}
        }
        /* QA fixtures for the bring-your-own-sailing screens (docs/specs/2026-09-10-byo-own-sailing.md).
           Every name is synthetic on purpose, so no screenshot can be mistaken for a real menu and no
           reviewer has to check whether a ship exists. The dates are fixed rather than relative,
           because both the countdown chip and Home's module 2 branch on whether today is inside the
           sailing; ten days, not fifteen, is what makes the chip's change visible. Each fixture
           writes all three keys and returns before the demo seed's own spcc2 write below, so the two
           never both run, and it writes spcc2 at the store's current persist version so no migrate
           step runs over it: the steps that mark a store entered would undo byo-new otherwise. */
        var fixture = q.get('fixture')
        if (fixture === 'byo-new' || fixture === 'byo-empty' || fixture === 'byo') {
          var SID = 'byo-QAFIXTR0'
          var fxSailings = fixture === 'byo-new' ? [] : [{ id: SID, ship: 'QA Sailing', line: 'QA Line', start: '2027-03-01', end: '2027-03-10', updatedAt: 0 }]
          var fxVenues = {}
          var fxCustom = [], fxEntries = {}, fxVisits = {}
          if (fixture === 'byo') {
            fxVenues[SID] = {
              'u-fixturebarone-qa01': { name: 'Fixture Bar One', deck: 4, type: 'Bar', hours: '4pm to late', blurb: 'A synthetic venue, for the screenshots.' },
              'u-fixturecafe-qa02': { name: 'Fixture Café', deck: 4, type: 'Café', hours: '7am to 6pm', blurb: '' },
              'u-fixturebartwo-qa03': { name: 'Fixture Bar Two', deck: 5, type: 'Bar', hours: '', blurb: '' }
            }
            var fxDrink = function (id, name, venue, category) {
              return { id: id, name: name, venue: venue, cruise: SID, category: category, spirits: [],
                ingredients: 'Ingredients not recorded', flavors: [], sweet: 3, strength: 3, frozen: false,
                price: null, desc: 'Added to your personal passport.', verified: true,
                plus: null, premier: null, extra: null }
            }
            fxCustom = [
              fxDrink('c1', 'Fixture Highball', 'u-fixturebarone-qa01', 'Classic'),
              fxDrink('c2', 'Fixture Sour', 'u-fixturebarone-qa01', 'Signature'),
              fxDrink('c3', 'Fixture Cold Brew', 'u-fixturebartwo-qa03', 'Coffee')
            ]
            fxEntries = { c1: { tried: true, date: '2027-03-04', rating: 4 }, c2: { tried: true, date: '2027-03-04' } }
            fxVisits = { 'u-fixturebarone-qa01': { visited: true, date: '2027-03-04' } }
          } else if (fixture === 'byo-empty') {
            fxVenues[SID] = {}
          }
          if (fixture === 'byo-new') localStorage.removeItem('spcc-cruise')
          else localStorage.setItem('spcc-cruise', SID)
          localStorage.setItem('spcc-sailings', JSON.stringify({ v: 1, sailings: fxSailings, venues: fxVenues }))
          localStorage.setItem('spcc2', JSON.stringify({ state: {
            me: { entries: fxEntries, visits: fxVisits },
            custom: fxCustom, friends: [], groups: [], pendingInvites: [], pendingUnfriends: [],
            profile: { id: 'me-self', name: 'Alex', colour: 'aqua' },
            cruiseId: fixture === 'byo-new' ? 'sun-princess-2026' : SID,
            enteredCruise: fixture !== 'byo-new',
            seenMedals: []
          }, version: 10 }))
          return
        }
        var DAYS = [], d = new Date('2026-10-03T12:00:00'), e = new Date('2026-10-17T12:00:00')
        while (d <= e) { DAYS.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1) }
        var entries = {}, visits = {}
        function seed(id, day, rating, fav, wish) { entries[id] = { tried: true, date: day }; if (rating) entries[id].rating = rating; if (fav) entries[id].fav = true; if (wish) entries[id].wish = true }
        for (var i = 0; i < 44; i++) seed('d' + i, DAYS[i % 7], (i % 5) + 1, i % 4 === 0, i % 6 === 0)
        for (var i = 0; i < 8; i++) seed('w' + i, DAYS[i % 7], (i % 5) + 1, i % 3 === 0, false)
        for (var i = 0; i < 6; i++) seed('b' + i, DAYS[i % 7], (i % 4) + 1, false, i % 2 === 0)
        ;['d80', 'd81', 'd90', 'w15', 'b20'].forEach(function (id) { entries[id] = { wish: true } })
        var VK = ['goodspirits', 'omalleys', 'princesslive', 'bellinis', 'coffeecurrents', 'wheelhouse', 'catch', 'crowngrill', 'butchers', 'spellbound', 'crooners', 'makoto', 'umai', 'sabatinis']
        VK.forEach(function (k) { visits[k] = { visited: true, date: DAYS[0] } })
        var friends = [
          // Sam = your taste twin: matches your ratings on shared drinks (d3/d4/d8/d9/d14), plus a few
          // gems you have not tried (d55/d60/d72) so recommendations + discovery show in the demo.
          { id: 'f-sam', name: 'Sam', colour: 'melon', exportedAt: Date.now() - 20 * 60000, passport: { entries: {
            d4: { tried: true, rating: 5, rec: true, comment: 'The blue one is unreal, get it first' },
            d9: { tried: true, rating: 5 }, d14: { tried: true, rating: 5, rec: true },
            d3: { tried: true, rating: 4 }, d8: { tried: true, rating: 4 },
            d55: { tried: true, rating: 5, rec: true, comment: 'Worth the walk to deck 16' },
            d60: { tried: true, rating: 5, rec: true }, d72: { tried: true, rating: 4, rec: true }
          }, visits: { crooners: { visited: true } } } },
          { id: 'f-ravi', name: 'Ravi', colour: 'lime', exportedAt: Date.now() - 3 * 3600000, passport: { entries: {
            d4: { tried: true, rating: 3 }, d9: { tried: true, rating: 4 }, d20: { tried: true, rating: 4 },
            d30: { tried: true, rating: 5, rec: true, comment: 'Order two, you will want a second' },
            d101: { tried: true, rating: 5, rec: true }, d66: { tried: true, rating: 4, rec: true }
          }, visits: {} } }
        ]
        // Sam and Ravi's entries carry dates too, so Home's crew lines and Log have something to say
        friends.forEach(function (f, fi) { var i = 0; for (var id in f.passport.entries) { if (f.passport.entries[id].tried) f.passport.entries[id].date = DAYS[(i++ + fi) % 5] } })
        var profile = { id: 'me-self', name: 'Alex', colour: 'aqua' }
        localStorage.setItem('spcc2', JSON.stringify({ state: { me: { entries: entries, visits: visits }, custom: [], friends: friends, profile: profile }, version: 2 }))
      } catch (e) {}
    })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

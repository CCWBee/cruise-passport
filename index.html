<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#FBF3E2" />
    <title>Sun Princess Cocktail Passport</title>
    <meta name="description" content="Tick off, rate and log all 214 cocktails aboard the Sun Princess (3 to 17 October 2026). Earn badges, unlock a Cruise Wrapped finale, and see what your crew loved. Works offline." />

    <!-- icons -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- installable web app -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cocktails" />

    <!-- share preview (Open Graph + Twitter). Absolute URLs for crawlers; canonical host is the Pages domain. -->
    <link rel="canonical" href="https://cruise.charlesbee.org/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cocktail Passport" />
    <meta property="og:title" content="Sun Princess Cocktail Passport" />
    <meta property="og:description" content="Tick off all 214 cocktails aboard the Sun Princess. Badges, a Cruise Wrapped finale, and what your crew loved." />
    <meta property="og:url" content="https://cruise.charlesbee.org/" />
    <meta property="og:image" content="https://cruise.charlesbee.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sun Princess Cocktail Passport" />
    <meta name="twitter:description" content="Tick off all 214 cocktails aboard. Badges, a Cruise Wrapped finale, and what your crew loved." />
    <meta name="twitter:image" content="https://cruise.charlesbee.org/og.png" />
    <script>
    /* SPA restore for GitHub Pages (pairs with public/404.html). Runs before the app + seed. */
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
        window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
      }
    }(window.location))
    </script>
    <script>
    /* Demo seed — gated on ?seed; loads sample data + two friends so the live demo is populated. */
    (function () {
      try {
        if (location.search.indexOf('seed') < 0) return
        var DAYS = [], d = new Date('2026-10-03T12:00:00'), e = new Date('2026-10-17T12:00:00')
        while (d <= e) { DAYS.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1) }
        var entries = {}, visits = {}
        function seed(id, day, rating, fav, wish) { entries[id] = { tried: true, date: day }; if (rating) entries[id].rating = rating; if (fav) entries[id].fav = true; if (wish) entries[id].wish = true }
        for (var i = 0; i < 44; i++) seed('d' + i, DAYS[i % 7], (i % 5) + 1, i % 4 === 0, i % 6 === 0)
        for (var i = 0; i < 8; i++) seed('w' + i, DAYS[i % 7], (i % 5) + 1, i % 3 === 0, false)
        for (var i = 0; i < 6; i++) seed('b' + i, DAYS[i % 7], (i % 4) + 1, false, i % 2 === 0)
        ;['d80', 'd81', 'd90', 'w15', 'b20'].forEach(function (id) { entries[id] = { wish: true } })
        var VK = ['goodspirits', 'omalleys', 'princesslive', 'bellinis', 'coffeecurrents', 'wheelhouse', 'catch', 'crowngrill', 'butchers', 'spellbound', 'crooners', 'makoto', 'umai', 'sabatinis']
        VK.forEach(function (k) { visits[k] = { visited: true, date: DAYS[0] } })
        var friends = [
          // Sam = your taste twin: matches your ratings on shared drinks (d3/d4/d8/d9/d14), plus a few
          // gems you have not tried (d55/d60/d72) so recommendations + discovery show in the demo.
          { id: 'f-sam', name: 'Sam', colour: 'melon', exportedAt: 1756000000000, passport: { entries: {
            d4: { tried: true, rating: 5, rec: true, comment: 'The blue one is unreal, get it first' },
            d9: { tried: true, rating: 5 }, d14: { tried: true, rating: 5, rec: true },
            d3: { tried: true, rating: 4 }, d8: { tried: true, rating: 4 },
            d55: { tried: true, rating: 5, rec: true, comment: 'Worth the walk to deck 16' },
            d60: { tried: true, rating: 5, rec: true }, d72: { tried: true, rating: 4, rec: true }
          }, visits: { crooners: { visited: true } } } },
          { id: 'f-ravi', name: 'Ravi', colour: 'lime', exportedAt: 1756000000000, passport: { entries: {
            d4: { tried: true, rating: 3 }, d9: { tried: true, rating: 4 }, d20: { tried: true, rating: 4 },
            d30: { tried: true, rating: 5, rec: true, comment: 'Order two, you will want a second' },
            d101: { tried: true, rating: 5, rec: true }, d66: { tried: true, rating: 4, rec: true }
          }, visits: {} } }
        ]
        var profile = { id: 'me-self', name: 'You', colour: 'aqua' }
        localStorage.setItem('spcc2', JSON.stringify({ state: { me: { entries: entries, visits: visits }, custom: [], friends: friends, profile: profile }, version: 2 }))
      } catch (e) {}
    })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

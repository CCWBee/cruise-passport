<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="only light">
  <meta name="darkreader-lock">
  <meta name="theme-color" content="#FBF8F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Harbour by day · Cocktail Passport</title>
  <link rel="stylesheet" href="a.css">
</head>
<body>
  <div class="phone" id="phone">
    <!-- desktop frame only: a phone draws its own -->
    <div class="statusbar" aria-hidden="true">
      <span>9:41</span>
      <svg viewBox="0 0 70 13"><rect x="0" y="8" width="3" height="5" rx="1"/><rect x="5" y="5.5" width="3" height="7.5" rx="1"/><rect x="10" y="3" width="3" height="10" rx="1"/><rect x="15" y="0" width="3" height="13" rx="1"/><path d="M31 3.2a9.6 9.6 0 0 1 12.8 0l-1.4 1.5a7.6 7.6 0 0 0-10 0zM33.4 5.8a6 6 0 0 1 8 0L40 7.3a4 4 0 0 0-5.2 0zM37.4 12 35.6 9.9a2.6 2.6 0 0 1 3.6 0z"/><rect x="48" y="1" width="19" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="50" y="3" width="13" height="7" rx="1.5"/><rect x="68" y="4.5" width="1.6" height="4" rx=".8"/></svg>
    </div>

    <main id="screens">
      <section class="screen" id="s-home" data-screen="home" aria-label="Home"></section>
      <section class="screen" id="s-drinks" data-screen="drinks" aria-label="Drinks"></section>
      <section class="screen" id="s-ship" data-screen="ship" aria-label="Ship"></section>
      <section class="screen" id="s-crew" data-screen="crew" aria-label="Crew"></section>
      <section class="screen" id="s-you" data-screen="you" aria-label="You"></section>
      <section class="screen" id="s-search" data-screen="search" aria-label="Log a drink"></section>
      <section class="screen is-pushed" id="s-medals" data-screen="medals" aria-label="Medals"></section>
    </main>

    <!-- the collapsing top bar, and the back button for a pushed screen -->
    <div class="topbar" aria-hidden="true"><span class="topbar-title" id="topbar-title"></span></div>
    <button class="back lg press" id="back" type="button" aria-label="Back">
      <svg class="lg-c" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg>
    </button>

    <div class="edge-bottom" aria-hidden="true"></div>

    <!-- the dock: five tabs in a floating glass capsule, and the round Log button at its trailing end -->
    <nav class="dock" id="dock" aria-label="Tabs">
      <div class="tabbar lg press" id="tabbar">
        <span class="droplet" id="droplet" aria-hidden="true"></span>
        <div class="tabs" id="tabs"></div>
        <button class="tab-current" id="tab-current" type="button" aria-label="Close search"></button>
      </div>
      <div class="logwrap lg lg-tint press" id="logwrap">
        <button class="logbtn" id="logbtn" type="button" aria-label="Log a drink">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg>
          <span aria-hidden="true">Log</span>
        </button>
        <form class="searchbox" id="searchbox" role="search" onsubmit="return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.2"/><path d="M20 20l-4.5-4.5"/></svg>
          <input id="q" type="search" placeholder="Drink, bar or spirit" aria-label="Find a drink to log" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" tabindex="-1">
          <button class="sb-clear" id="sb-clear" type="button" aria-label="Close search" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg>
          </button>
        </form>
      </div>
    </nav>

    <!-- one sheet at a time -->
    <div class="sheet-layer" id="sheet-layer">
      <div class="scrim" id="scrim"></div>
      <div class="sheet lg" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
        <div class="grab" id="grab"><button class="grabber" id="grabber" type="button" aria-label="Expand"></button></div>
        <button class="sheet-x" id="sheet-x" type="button" aria-label="Close"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 7l10 10M17 7 7 17"/></svg></span></button>
        <div class="sheet-scroll" id="sheet-scroll"></div>
      </div>
    </div>

    <p class="sr-only" id="live" aria-live="polite"></p>
  </div>
  <script src="a.js"></script>
</body>
</html>

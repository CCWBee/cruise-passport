<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="darkreader-lock">
<title>Cold storage slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<!--
  The email as the Wrapped story: one 1080x1350 slide per card, drawn on canvas in the app's room
  idiom (wrappedImage.ts: a gradient and three pools of light), each slide its own colour as a story
  card would be, with the drink's own glass (GlassIcon) drawn large where a slide names a drink.
  Nunito stands in for the app's SF Pro Rounded, which a canvas here cannot load. Load through the
  dev server (/tools/coldstorage/slides.html) with tools/coldstorage/receiver.mjs running, then
  await runAll(['CODE', ...]); each slide is posted as slide-<code>-<n>.png.
-->
</head>
<body style="background:#130F1F;color:#F6F1E9;font-family:Nunito,system-ui;margin:0">
<p id="out" style="margin:8px">ready</p>
<div id="show" style="display:flex;flex-wrap:wrap;gap:8px;padding:8px"></div>
<script type="module">
import { createElement } from 'react'
import { renderToStaticMarkup } from 'react-dom/server'
import { GlassIcon } from '/src/ui/Icon.tsx'

const W = 1080, H = 1350, M = 96
const INK = '#F6F1E9', INK2 = 'rgba(246,241,233,.78)', INK3 = 'rgba(246,241,233,.56)', CORAL = '#FF6B84', BRAND = '#FF5B78'
const HUE = { cocktail: '#FF8FB0', margarita: '#B5E07A', wine: '#F29AB6', flute: '#F2D675', pint: '#FFBE73',
  cup: '#E6BFA3', hurricane: '#FF9F73', highball: '#6FE3DA', rocks: '#F0B884' }
const rgb = (hex) => { const n = parseInt(hex.slice(1), 16); return `${n >> 16 & 255}, ${n >> 8 & 255}, ${n & 255}` }

// Rooms: a base gradient and three pools (colour, alpha, x, y as fractions, radius against W). The
// first three are the app's own rooms (tokens.css); the rest push one of its hues to the front, as a
// story card that is about that thing would.
const ROOMS = {
  evening: { base: ['#1A1830', '#18132A', '#140E22'], pools: [['#FF5B78', .42, 0, .62, .8], ['#FFA640', .38, .98, .34, .7], ['#FFD48C', .24, .1, .06, .6]] },
  coral: { base: ['#2B0E22', '#1E0A1C', '#120816'], pools: [['#FF4D6D', .62, .2, .7, .95], ['#FF9F43', .34, .95, .2, .7], ['#9B4DFF', .22, .05, .05, .6]] },
  night: { base: ['#0B1222', '#0F1121', '#130F1F'], pools: [['#4A63FF', .44, .1, .12, .85], ['#2EC4B6', .30, .95, .75, .75], ['#FF4D6D', .24, .05, .95, .6]] },
  amber: { base: ['#24140C', '#1C0F10', '#140C14'], pools: [['#FF9F43', .56, .85, .2, .9], ['#FF4D6D', .34, .05, .85, .75], ['#FFD48C', .26, .3, .02, .55]] },
  violet: { base: ['#1A1036', '#140C2A', '#100A1E'], pools: [['#9B7BFF', .52, .15, .25, .9], ['#FF5B78', .36, .9, .85, .75], ['#4A63FF', .30, .95, .05, .6]] },
  teal: { base: ['#0A1A20', '#0B1420', '#0F1121'], pools: [['#2EC4B6', .48, .9, .25, .9], ['#4A63FF', .30, .05, .8, .75], ['#FF8FB0', .22, .1, .05, .55]] },
}
const glassRoom = (family) => {
  const h = HUE[family] ?? CORAL
  return { base: ['#120E20', '#100C1C', '#0E0A18'], pools: [[h, .5, .78, .3, .95], ['#FF5B78', .26, .05, .9, .7], ['#4A63FF', .22, .1, .05, .55]] }
}

function paint(ctx, room) {
  const g = ctx.createLinearGradient(0, 0, 0, H)
  room.base.forEach((c, i) => g.addColorStop(i / (room.base.length - 1), c))
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H)
  for (const [hex, a, x, y, r] of room.pools) {
    const gr = ctx.createRadialGradient(x * W, y * H, 0, x * W, y * H, r * W)
    gr.addColorStop(0, `rgba(${rgb(hex)}, ${a})`); gr.addColorStop(1, `rgba(${rgb(hex)}, 0)`)
    ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H)
  }
}

async function glassImage(family, px) {
  const html = renderToStaticMarkup(createElement(GlassIcon, { family, size: px }))
  const svgs = [...new DOMParser().parseFromString(html, 'text/html').querySelectorAll('svg')]
  const imgs = []
  for (const el of svgs) {
    el.setAttribute('xmlns', 'http://www.w3.org/2000/svg')
    el.setAttribute('color', HUE[family] ?? CORAL)
    el.removeAttribute('style')
    if (el.getAttribute('class')?.includes('gicon-halo')) { el.setAttribute('stroke-width', '4.4'); el.setAttribute('opacity', '.22') }
    const img = new Image()
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(el.outerHTML)
    await img.decode(); imgs.push(img)
  }
  return imgs
}

const font = (ctx, w, px) => { ctx.font = `${w} ${px}px Nunito, system-ui, sans-serif` }
// wrap to a width; returns the lines
function wrap(ctx, text, width) {
  const words = String(text).split(/\s+/), lines = []; let line = ''
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > width && line) { lines.push(line); line = w } else line = t }
  if (line) lines.push(line); return lines
}
// the largest size at which `text` fits `width` in at most `maxLines`
function fit(ctx, weight, text, width, maxPx, minPx, maxLines) {
  for (let px = maxPx; px >= minPx; px -= 4) { font(ctx, weight, px); if (wrap(ctx, text, width).length <= maxLines && wrap(ctx, text, width).every((l) => ctx.measureText(l).width <= width)) return px }
  return minPx
}

/** One slide. spec: { room, eyebrow, head, headMax, sub, glass, number, bars, foot } */
async function slide(spec) {
  const c = document.createElement('canvas'); c.width = W; c.height = H
  const ctx = c.getContext('2d'); ctx.textBaseline = 'alphabetic'
  paint(ctx, spec.room)
  if (spec.menu) {
    // the whole menu: the nine glasses, each in its family's hue, a three by three grid up top
    const fams = ['cocktail', 'margarita', 'flute', 'highball', 'hurricane', 'wine', 'rocks', 'pint', 'cup']
    const px = 150, gap = 46, x0 = W - M - (px * 3 + gap * 2) + 20, y0 = M + 76
    for (let i = 0; i < 9; i++) for (const img of await glassImage(fams[i], px)) ctx.drawImage(img, x0 + (i % 3) * (px + gap), y0 + Math.floor(i / 3) * (px + gap), px, px)
  } else if (spec.glass) {
    const px = 520
    for (const img of await glassImage(spec.glass, px)) ctx.drawImage(img, W - M - px + 40, M + 40, px, px)
  }
  // wordmark, top left, as the story's header would carry it
  font(ctx, 800, 34); ctx.fillStyle = BRAND; ctx.fillText('Cocktail Passport', M, M + 30)
  let y = H - M
  // build bottom-up so every slide's text sits on the same baseline grid at the foot
  const blocks = []
  if (spec.foot) { font(ctx, 600, 34); blocks.push({ lines: wrap(ctx, spec.foot, W - M * 2), w: 600, px: 34, colour: INK3, lh: 1.3 }) }
  if (spec.sub) { font(ctx, 600, 50); blocks.push({ lines: wrap(ctx, spec.sub, W - M * 2), w: 600, px: 50, colour: INK2, lh: 1.25, gap: 28 }) }
  if (spec.head) {
    const px = fit(ctx, 900, spec.head, W - M * 2, spec.headMax ?? 150, 72, spec.headLines ?? 3)
    font(ctx, 900, px); blocks.push({ lines: wrap(ctx, spec.head, W - M * 2), w: 900, px, colour: INK, lh: 1.02, gap: 28, track: -0.02 })
  }
  if (spec.number !== undefined) { blocks.push({ lines: [String(spec.number)], w: 900, px: spec.number >= 100 ? 300 : 400, colour: spec.numberColour ?? INK, lh: .9, gap: 10, track: -0.04 }) }
  if (spec.eyebrow) { font(ctx, 700, 44); blocks.push({ lines: wrap(ctx, spec.eyebrow, W - M * 2), w: 700, px: 44, colour: spec.eyebrowColour ?? CORAL, lh: 1.25, gap: 26 }) }
  for (const b of blocks) {
    font(ctx, b.w, b.px); ctx.fillStyle = b.colour
    ctx.letterSpacing = b.track ? `${b.track * b.px}px` : '0px'
    for (let i = b.lines.length - 1; i >= 0; i--) { ctx.fillText(b.lines[i], M, y); y -= b.px * b.lh }
    y -= b.gap ?? 0
  }
  ctx.letterSpacing = '0px'
  if (spec.bars) {
    // the party: name, a bar against the most anyone logged, the count
    font(ctx, 700, 44); ctx.fillStyle = spec.barsTitleColour ?? CORAL; ctx.fillText(spec.barsTitle, M, M + 150)
    const top = M + 330, rowH = 190, max = Math.max(1, ...spec.bars.map((b) => b.n))
    spec.bars.forEach((b, i) => {
      const yy = top + i * rowH
      font(ctx, 800, 56); ctx.fillStyle = b.me ? CORAL : INK; ctx.fillText(b.name + (b.me ? ' (you)' : ''), M, yy)
      const bw = Math.max(28, (W - M * 2 - 170) * b.n / max)
      ctx.fillStyle = b.me ? CORAL : 'rgba(246,241,233,.24)'
      ctx.beginPath(); ctx.roundRect(M, yy + 34, bw, 44, 22); ctx.fill()
      font(ctx, 900, 84); ctx.fillStyle = b.me ? CORAL : INK; ctx.textAlign = 'right'; ctx.fillText(String(b.n), W - M, yy + 80); ctx.textAlign = 'left'
    })
  }
  return new Promise((r) => c.toBlob(r, 'image/jpeg', .9))
}

const join = (xs) => xs.length < 2 ? (xs[0] ?? '') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`
const first = (n) => String(n || '').trim().split(/\s+/)[0]
const card = (s, k) => s.cards.find((c) => c.kind === k)

function specs(s, party) {
  const n = s.tried.length, out = [], gl = (name) => s.crewGlass?.[name] ?? 'cocktail'
  out.push({ room: ROOMS.evening, menu: true, eyebrow: 'Sun Princess · 3 to 17 October 2026', head: `${first(s.name)}'s voyage, in drinks`, headMax: 118 })
  out.push({ room: ROOMS.coral, eyebrow: 'Drinks tried', eyebrowColour: '#FFC2CD', number: n, sub: n ? `${Math.round(n / s.total * 100)}% of the ${s.total} on board` : `of the ${s.total} on board. Not one.`, foot: n ? '' : 'Restraint, or a passport left in the cabin. We may never know.' })
  const t = card(s, 'topbar'); if (t) out.push({ room: ROOMS.night, eyebrow: 'Your bar', head: t.venue, headMax: 170, sub: `Deck ${t.deck}, ${t.count} ${t.count === 1 ? 'drink' : 'drinks'}`, eyebrowColour: '#9DB0FF' })
  const b = card(s, 'bigday'); if (b) out.push({ room: ROOMS.amber, eyebrow: 'Your biggest day', number: b.count, sub: `drinks on ${b.date}`, eyebrowColour: '#FFC98A' })
  const a = card(s, 'archetype'); if (a) out.push({ room: ROOMS.violet, eyebrow: 'Your taste', head: `You are ${a.archetype.name}`, headMax: 150, sub: a.archetype.blurb, eyebrowColour: '#C9B8FF' })
  const sp = card(s, 'split'); if (sp) out.push({ room: glassRoom(gl(sp.name)), glass: gl(sp.name), eyebrow: 'The one that split you', head: sp.name, sub: `You gave it ${sp.mine}. ${sp.friend} gave it ${sp.theirs}.` })
  const f = card(s, 'find'); if (f) out.push({ room: glassRoom(gl(f.name)), glass: gl(f.name), eyebrow: 'Your find', head: f.name, sub: `Nobody else in the crew tried it${f.rating ? `. You gave it ${f.rating} out of 5.` : '.'}` })
  const top = party[0], mine = top.code === s.code
  out.push({ room: ROOMS.teal, barsTitle: 'How the party did', barsTitleColour: '#8FF0E6', bars: party.map((p) => ({ name: first(p.name), n: p.n, me: p.code === s.code })),
    foot: mine ? 'You carried the party. Someone had to.' : `${first(top.name)} carried the party. Someone had to.` })
  const nx = card(s, 'nexttime'); if (nx) out.push({ room: glassRoom(gl(nx.name)), glass: gl(nx.name), eyebrow: 'Next time', head: nx.name, sub: `${join(nx.by)} loved it${nx.note ? `: "${nx.note.text.trim()}"` : '.'}` })
  return out
}

// ── the summary poster: the whole voyage on one page, as the last card of a Wrapped is ──────────
function stamp(ctx, cx, cy, lines) {
  // a passport stamp in coral ink: a double-ruled frame, slightly turned, the sailing inside
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(-8 * Math.PI / 180)
  const w = 430, h = 170, ink = 'rgba(255, 107, 132, .92)'
  ctx.strokeStyle = ink; ctx.fillStyle = ink
  ctx.lineWidth = 7; ctx.beginPath(); ctx.roundRect(-w / 2, -h / 2, w, h, 26); ctx.stroke()
  ctx.lineWidth = 2.5; ctx.beginPath(); ctx.roundRect(-w / 2 + 14, -h / 2 + 14, w - 28, h - 28, 16); ctx.stroke()
  ctx.textAlign = 'center'
  font(ctx, 900, 38); ctx.letterSpacing = '4px'; ctx.fillText(lines[0], 0, -4)
  font(ctx, 800, 28); ctx.letterSpacing = '3px'; ctx.fillText(lines[1], 0, 40)
  ctx.letterSpacing = '0px'; ctx.textAlign = 'left'
  // worn ink: a fixed scatter of small gaps, so it reads as stamped rather than drawn
  ctx.globalCompositeOperation = 'destination-out'
  let seed = 7
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
  for (let i = 0; i < 140; i++) { ctx.globalAlpha = .2 + rnd() * .4; ctx.beginPath(); ctx.arc((rnd() - .5) * w, (rnd() - .5) * h, .8 + rnd() * 2.2, 0, Math.PI * 2); ctx.fill() }
  ctx.restore()
}

async function poster(s, party) {
  const PH = 3200
  const c = document.createElement('canvas'); c.width = W; c.height = PH
  const ctx = c.getContext('2d'); ctx.textBaseline = 'alphabetic'
  // the evening room, painted over the whole height
  const room = ROOMS.evening
  const g = ctx.createLinearGradient(0, 0, 0, PH); room.base.forEach((col, i) => g.addColorStop(i / 2, col))
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, PH)
  for (const [hex, a, x, y, r] of [['#FF5B78', .40, .02, .30, .85], ['#FFA640', .32, 1, .12, .7], ['#9B7BFF', .26, .95, .62, .8], ['#4A63FF', .22, .05, .9, .75]]) {
    const gr = ctx.createRadialGradient(x * W, y * PH, 0, x * W, y * PH, r * W)
    gr.addColorStop(0, `rgba(${rgb(hex)}, ${a})`); gr.addColorStop(1, `rgba(${rgb(hex)}, 0)`); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, PH)
  }
  const n = s.tried.length, colW = (W - M * 2 - 60) / 2
  font(ctx, 800, 34); ctx.fillStyle = BRAND; ctx.fillText('Cocktail Passport', M, M + 30)
  stamp(ctx, W - M - 190, M + 130, ['SUN PRINCESS', '3 TO 17 OCT 2026'])

  // the name
  let y = M + 330
  const head = `${first(s.name)}'s voyage`
  const hp = fit(ctx, 900, head, W - M * 2, 132, 80, 2); font(ctx, 900, hp); ctx.fillStyle = INK; ctx.letterSpacing = `${-.02 * hp}px`
  for (const l of wrap(ctx, head, W - M * 2)) { ctx.fillText(l, M, y); y += hp * 1.02 }
  ctx.letterSpacing = '0px'

  // the count
  y += 210
  font(ctx, 900, 300); ctx.fillStyle = INK; ctx.letterSpacing = '-12px'; ctx.fillText(String(n), M - 8, y); const nw = ctx.measureText(String(n)).width; ctx.letterSpacing = '0px'
  font(ctx, 800, 52); ctx.fillStyle = INK; ctx.fillText(n === 1 ? 'drink tried' : 'drinks tried', M + nw + 40, y - 92)
  font(ctx, 600, 38); ctx.fillStyle = INK2; ctx.fillText(`${Math.round(n / s.total * 100)}% of the ${s.total} on board`, M + nw + 40, y - 36)

  // two columns: top drinks, top bars
  y += 120
  const eyebrow = (t, x, yy, colour = CORAL) => { font(ctx, 800, 36); ctx.fillStyle = colour; ctx.fillText(t, x, yy) }
  const xR = M + colW + 60
  eyebrow('Top drinks', M, y); eyebrow('Top bars', xR, y)
  let yl = y + 30, yr = y + 30
  const top = [...s.tried].sort((a, b) => (b.rating ?? 0) - (a.rating ?? 0) || Number(b.fav) - Number(a.fav) || b.date.localeCompare(a.date)).slice(0, 5)
  if (!top.length) { font(ctx, 600, 38); ctx.fillStyle = INK2; for (const l of wrap(ctx, 'Nothing logged. The menu remains a mystery.', colW)) { yl += 52; ctx.fillText(l, M, yl) } }
  for (const t of top) {
    yl += 26
    for (const img of await glassImage(t.glass, 64)) ctx.drawImage(img, M, yl, 64, 64)
    const tx = M + 88, tw = colW - 88
    let px = 38; font(ctx, 800, px); while (ctx.measureText(t.name).width > tw && px > 26) { px -= 2; font(ctx, 800, px) }
    ctx.fillStyle = INK; ctx.fillText(t.name, tx, yl + 30)
    font(ctx, 700, 28); ctx.fillStyle = CORAL; ctx.letterSpacing = '3px'
    ctx.fillText(t.rating ? '★'.repeat(t.rating) + '☆'.repeat(5 - t.rating) : 'not rated', tx, yl + 68); ctx.letterSpacing = '0px'
    yl += 76
  }
  const bars = Object.entries(s.tried.reduce((m, t) => (m[t.venue] = (m[t.venue] ?? 0) + 1, m), {})).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 4)
  if (!bars.length) { font(ctx, 600, 38); ctx.fillStyle = INK2; for (const l of wrap(ctx, 'None visited, on paper.', colW)) { yr += 52; ctx.fillText(l, xR, yr) } }
  bars.forEach(([v, k], i) => {
    yr += 26
    font(ctx, 900, 44); ctx.fillStyle = i ? INK3 : CORAL; ctx.fillText(String(i + 1), xR, yr + 46)
    const tx = xR + 56, tw = colW - 56
    font(ctx, 800, 38); const lines = wrap(ctx, v, tw).slice(0, 2)
    ctx.fillStyle = INK; lines.forEach((l, j) => ctx.fillText(l, tx, yr + 30 + j * 42))
    font(ctx, 600, 28); ctx.fillStyle = INK2; ctx.fillText(`${k} ${k === 1 ? 'drink' : 'drinks'}`, tx, yr + 30 + lines.length * 42)
    yr += 30 + lines.length * 42
  })

  // three facts across
  y = Math.max(yl, yr) + 110
  const bd = card(s, 'bigday'), a = card(s, 'archetype'), m = card(s, 'medals')
  const short = (d) => { const p = d.split(' '); return p.length === 3 ? `${p[0].slice(0, 3)} ${p[1]} ${p[2].slice(0, 3)}` : d }
  const facts = [
    ['Biggest day', bd ? short(bd.date) : 'None yet', bd ? `${bd.count} ${bd.count === 1 ? 'drink' : 'drinks'}` : ''],
    ['Your taste', a ? a.archetype.name.replace(/^The /, '') : 'Undeclared', ''],
    ['Medals', `${m ? m.count : 0} of 18`, s.medals.join(', ')],
  ]
  const fw = (W - M * 2) / 3
  facts.forEach(([k, v, sub], i) => {
    const x = M + i * fw
    eyebrow(k, x, y, INK3)
    let px = 50; font(ctx, 900, px); while (ctx.measureText(v).width > fw - 24 && px > 30) { px -= 2; font(ctx, 900, px) }
    ctx.fillStyle = INK; ctx.fillText(v, x, y + 64)
    if (sub) { font(ctx, 600, 30); ctx.fillStyle = INK2; ctx.fillText(sub, x, y + 108) }
  })

  // the party
  y += 230
  eyebrow('The party', M, y, '#8FF0E6')
  const max = Math.max(1, ...party.map((p) => p.n))
  party.forEach((p, i) => {
    const yy = y + 50 + i * 86, me = p.code === s.code
    font(ctx, 800, 38); ctx.fillStyle = me ? CORAL : INK; ctx.fillText(first(p.name), M, yy + 38)
    const bx = M + 250, bwMax = W - M * 2 - 250 - 100
    ctx.fillStyle = me ? CORAL : 'rgba(246,241,233,.24)'; ctx.beginPath(); ctx.roundRect(bx, yy + 10, Math.max(20, bwMax * p.n / max), 34, 17); ctx.fill()
    font(ctx, 900, 48); ctx.fillStyle = me ? CORAL : INK; ctx.textAlign = 'right'; ctx.fillText(String(p.n), W - M, yy + 44); ctx.textAlign = 'left'
  })
  y += 50 + party.length * 86 + 70
  font(ctx, 700, 30); ctx.fillStyle = INK3; ctx.fillText('cruise.charlesbee.org', M, y)
  const out = document.createElement('canvas'); out.width = W; out.height = y + M
  out.getContext('2d').drawImage(c, 0, 0)
  return new Promise((r) => out.toBlob(r, 'image/jpeg', .92))
}

window.runPosters = async (codes, show = false) => {
  await document.fonts.load('900 100px Nunito'); await document.fonts.load('600 40px Nunito'); await document.fonts.load('800 40px Nunito'); await document.fonts.ready
  const all = await Promise.all(codes.map(async (c) => (await fetch(`/archive/summaries/${c}.json`)).json()))
  const party = all.map((s) => ({ code: s.code, name: s.name, n: s.tried.length })).sort((a, b) => b.n - a.n)
  const done = []
  for (const s of all) {
    const blob = await poster(s, party)
    if (show) { const im = new Image(); im.src = URL.createObjectURL(blob); im.style.width = '360px'; document.getElementById('show').append(im) }
    else await post(`poster-${s.code}`, blob)
    done.push(s.code)
  }
  return done
}

const post = (name, blob) => fetch(`http://127.0.0.1:8792/save?name=${name}`, { method: 'POST', body: blob })

// ── the email's hero banner: the evening room and the menu's nine glasses, no words (the words in an
// email stay live text, so they can be read, searched and translated) ─────────────────────────────
window.runHero = async () => {
  const HW = 1200, HH = 520
  const c = document.createElement('canvas'); c.width = HW; c.height = HH
  const ctx = c.getContext('2d')
  const g = ctx.createLinearGradient(0, 0, 0, HH); ['#1A1830', '#18132A', '#140E22'].forEach((col, i) => g.addColorStop(i / 2, col))
  ctx.fillStyle = g; ctx.fillRect(0, 0, HW, HH)
  for (const [hex, a, x, y, r] of [['#FF5B78', .5, .1, .9, .55], ['#FFA640', .42, .92, .2, .5], ['#9B7BFF', .3, .55, -.1, .45], ['#4A63FF', .22, .02, .05, .4]]) {
    const gr = ctx.createRadialGradient(x * HW, y * HH, 0, x * HW, y * HH, r * HW)
    gr.addColorStop(0, `rgba(${rgb(hex)}, ${a})`); gr.addColorStop(1, `rgba(${rgb(hex)}, 0)`); ctx.fillStyle = gr; ctx.fillRect(0, 0, HW, HH)
  }
  const fams = ['cocktail', 'margarita', 'flute', 'highball', 'hurricane', 'wine', 'rocks', 'pint', 'cup']
  const px = 104, gap = (HW - 2 * 80 - px * 9) / 8
  for (let i = 0; i < 9; i++) {
    const y = HH / 2 - px / 2 + (i % 2 ? 34 : -34)
    for (const img of await glassImage(fams[i], px)) ctx.drawImage(img, 80 + i * (px + gap), y, px, px)
  }
  const blob = await new Promise((r) => c.toBlob(r, 'image/jpeg', .9))
  await post('hero', blob)
  return 'hero'
}
window.runAll = async (codes, show = false) => {
  await document.fonts.load('900 100px Nunito'); await document.fonts.load('600 40px Nunito'); await document.fonts.ready
  const all = await Promise.all(codes.map(async (c) => (await fetch(`/archive/summaries/${c}.json`)).json()))
  const party = all.map((s) => ({ code: s.code, name: s.name, n: s.tried.length })).sort((a, b) => b.n - a.n)
  const done = []
  for (const s of all) {
    const list = specs(s, party)
    for (let i = 0; i < list.length; i++) {
      const blob = await slide(list[i])
      if (show) { const im = new Image(); im.src = URL.createObjectURL(blob); im.style.width = '216px'; document.getElementById('show').append(im) }
      else await post(`slide-${s.code}-${i + 1}`, blob)
      done.push(`${s.code}-${i + 1}`)
    }
  }
  document.getElementById('out').textContent = done.join(' ')
  return done
}
